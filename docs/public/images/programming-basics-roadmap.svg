<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Arduino 程式基礎學習地圖</title><desc id="desc">五個步驟：螢幕輸出、變數、條件、循環、完成狀態報告。</desc>
  <rect width="1200" height="500" rx="28" fill="#f8f5ee"/>
  <text x="72" y="90" fill="#172a3a" font-family="Microsoft JhengHei, sans-serif" font-size="38" font-weight="700">先讓程式說話</text>
  <text x="72" y="132" fill="#5d6870" font-family="Microsoft JhengHei, sans-serif" font-size="22">先看得見邏輯，下一單元才把結果交給硬件。</text>
  <g font-family="Microsoft JhengHei, sans-serif">
    <g transform="translate(72 200)"><rect width="190" height="190" rx="20" fill="#e4f1f8"/><text x="24" y="47" fill="#3080B8" font-size="18" font-weight="700">01</text><text x="24" y="92" fill="#172a3a" font-size="29" font-weight="700">文字輸出</text><text x="24" y="128" fill="#5d6870" font-size="19">Serial Monitor</text></g>
    <g transform="translate(290 200)"><rect width="190" height="190" rx="20" fill="#e3f3ee"/><text x="24" y="47" fill="#2d988e" font-size="18" font-weight="700">02</text><text x="24" y="92" fill="#172a3a" font-size="29" font-weight="700">變數</text><text x="24" y="128" fill="#5d6870" font-size="19">保存、計算資料</text></g>
    <g transform="translate(508 200)"><rect width="190" height="190" rx="20" fill="#fff0db"/><text x="24" y="47" fill="#b37a11" font-size="18" font-weight="700">03</text><text x="24" y="92" fill="#172a3a" font-size="29" font-weight="700">if</text><text x="24" y="128" fill="#5d6870" font-size="19">按情況判斷</text></g>
    <g transform="translate(726 200)"><rect width="190" height="190" rx="20" fill="#fee9e3"/><text x="24" y="47" fill="#e6563a" font-size="18" font-weight="700">04</text><text x="24" y="92" fill="#172a3a" font-size="29" font-weight="700">for</text><text x="24" y="128" fill="#5d6870" font-size="19">有規律地重複</text></g>
    <g transform="translate(944 200)"><rect width="190" height="190" rx="20" fill="#ece9f7"/><text x="24" y="47" fill="#6c5eb0" font-size="18" font-weight="700">05</text><text x="24" y="92" fill="#172a3a" font-size="29" font-weight="700">小報告</text><text x="24" y="128" fill="#5d6870" font-size="19">合成一個程式</text></g>
  </g>
</svg>
