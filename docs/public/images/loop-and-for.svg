<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
 <title id="title">loop 和 for 的分工</title><desc id="desc">loop 是程式整體持續重複，for 是指定次數的重複工作。</desc>
 <rect width="1200" height="450" rx="28" fill="#f8f5ee"/><text x="70" y="84" fill="#172a3a" font-family="Microsoft JhengHei, sans-serif" font-size="36" font-weight="700">兩種重複，各有用途</text>
 <g font-family="Microsoft JhengHei, sans-serif"><rect x="76" y="145" width="490" height="220" rx="20" fill="#e4f1f8"/><text x="110" y="206" fill="#3080B8" font-size="28" font-weight="700">void loop()</text><text x="110" y="260" fill="#172a3a" font-size="25">Arduino 程式會持續重複</text><text x="110" y="308" fill="#5d6870" font-size="20">日後：不斷讀取資料、更新燈號</text><rect x="634" y="145" width="490" height="220" rx="20" fill="#ece9f7"/><text x="668" y="206" fill="#6c5eb0" font-size="28" font-weight="700">for (...)</text><text x="668" y="260" fill="#172a3a" font-size="25">由你指定重複幾多次</text><text x="668" y="308" fill="#5d6870" font-size="20">例子：倒數、逐項檢查、固定次數測試</text></g>
</svg>
