<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300"><rect width="1200" height="300" rx="22" fill="#112a44"/><text x="55" y="56" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="23" fill="#f6cf63">PROGRAM SETTINGS / 先為腳位命名</text><g font-family="Arial,'Microsoft JhengHei',sans-serif"><rect x="70" y="100" width="400" height="125" rx="14" fill="#173d58" stroke="#56c5b6"/><text x="105" y="148" font-size="24" fill="#fff">const int greenLed = 8;</text><text x="105" y="187" font-size="17" fill="#b7d7d2">名稱說明用途，數字保存位置</text><rect x="550" y="100" width="580" height="125" rx="14" fill="#167a7a"/><text x="590" y="148" font-size="24" fill="#fff">digitalWrite(greenLed, HIGH);</text><text x="590" y="187" font-size="17" fill="#d8f4ef">讀起來就是：讓綠燈亮起</text><text x="490" y="170" font-size="30" fill="#f6cf63">→</text></g></svg>
