<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350"><rect width="1200" height="350" rx="22" fill="#112a44"/><text x="55" y="55" font-family="Arial,'Microsoft JhengHei',sans-serif" font-size="24" fill="#f6cf63" letter-spacing="2">DIGITAL OUTPUT / 8 號腳位</text><g font-family="Arial,'Microsoft JhengHei',sans-serif"><rect x="70" y="105" width="340" height="170" rx="16" fill="#173d58" stroke="#56c5b6" stroke-width="2"/><text x="105" y="160" font-size="22" fill="#fff">pinMode(8, OUTPUT)</text><text x="105" y="210" font-size="18" fill="#b7d7d2">先告訴 Arduino：</text><text x="105" y="242" font-size="18" fill="#b7d7d2">8 號腳位負責輸出</text><rect x="470" y="105" width="270" height="170" rx="16" fill="#167a7a"/><text x="520" y="160" font-size="22" fill="#fff">digitalWrite</text><text x="520" y="208" font-size="18" fill="#d8f4ef">HIGH = 亮</text><text x="520" y="242" font-size="18" fill="#d8f4ef">LOW = 熄</text><rect x="800" y="105" width="330" height="170" rx="16" fill="#e24f3d"/><text x="845" y="160" font-size="22" fill="#fff">8 → 電阻 → LED</text><text x="845" y="210" font-size="18" fill="#fff4ea">程式中的腳位</text><text x="845" y="242" font-size="18" fill="#fff4ea">要和電路相同</text><text x="430" y="198" font-size="30" fill="#f6cf63">→</text><text x="760" y="198" font-size="30" fill="#f6cf63">→</text></g></svg>
