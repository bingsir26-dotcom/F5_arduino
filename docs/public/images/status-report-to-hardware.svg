<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
 <title id="title">由程式狀態到硬件回應</title><desc id="desc">程式先顯示溫度偏高的文字結果，之後可以用紅色 LED 代表同一種狀態。</desc>
 <rect width="1200" height="470" rx="28" fill="#f8f5ee"/><text x="70" y="84" fill="#172a3a" font-family="Microsoft JhengHei, sans-serif" font-size="36" font-weight="700">程式規則先驗證，硬件回應後加入</text>
 <g font-family="Microsoft JhengHei, sans-serif"><rect x="76" y="145" width="330" height="230" rx="20" fill="#fffdf8" stroke="#d8d0c1" stroke-width="3"/><text x="108" y="202" fill="#5d6870" font-size="19" font-weight="700">SERIAL MONITOR</text><text x="108" y="273" fill="#172a3a" font-size="27" font-weight="700">溫度偏高</text><text x="108" y="316" fill="#e6563a" font-size="25">建議通風</text><rect x="450" y="145" width="330" height="230" rx="20" fill="#fff0db"/><text x="482" y="202" fill="#b37a11" font-size="19" font-weight="700">程式條件</text><text x="482" y="277" fill="#172a3a" font-family="Consolas, monospace" font-size="25">temperature &gt; 26</text><rect x="824" y="145" width="300" height="230" rx="20" fill="#fee9e3"/><text x="856" y="202" fill="#e6563a" font-size="19" font-weight="700">下一單元</text><circle cx="974" cy="287" r="55" fill="#e6563a"/><rect x="949" y="355" width="50" height="12" rx="6" fill="#172a3a"/><text x="856" y="334" fill="#172a3a" font-size="24" font-weight="700">紅色 LED 亮起</text></g>
</svg>
